<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 로또 - 게임보이 스타일</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase 클라이언트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="gameboy-screen">
        <div class="screen-border">
            <div class="screen-content">
                <!-- 배틀 화면 스타일 헤더 - Pokedex 스타일 -->
                <div class="battle-header">
                    <div class="trainer-sprite" id="trainerSprite"></div>
                    <div class="battle-info">
                        <div class="trainer-name" id="trainerName">TRAINER</div>
                        <div class="trainer-id" id="trainerId">No. 00001</div>
                        <div class="trainer-category">LOTTO PLAYER</div>
                    </div>
                </div>

                <!-- 배틀 메뉴 스타일 컨트롤 -->
                <div class="battle-menu">
                    <div class="input-box">
                        <div class="text-box">
                            <span>SET COUNT:</span>
                            <input type="number" id="setCount" min="1" max="10" value="1" class="pixel-input">
                        </div>
                    </div>
                    <button class="fight-button" id="generateBtn">
                        <span class="menu-cursor">►</span>FIGHT
                    </button>
                </div>

                <!-- 메시지 박스 -->
                <div class="message-box" id="messageBox">
                    <div class="message-text">포켓몬을 선택하여 번호를 생성하세요!</div>
                </div>

                <!-- 결과 표시 영역 -->
                <div id="results" class="results"></div>

                <!-- 저장된 번호 -->
                <div class="recent-section">
                    <div class="section-title">SAVED NUMBERS</div>
                    <div id="savedNumbers" class="recent-winners">
                        <div class="loading">
                            <span class="loading-text">저장된 번호를 불러오는 중</span>
                            <span class="loading-dots"></span>
                        </div>
                    </div>
                </div>

                <!-- 최근 당첨번호 -->
                <div class="recent-section">
                    <div class="section-title">RECENT WINNERS</div>
                    <div id="recentWinners" class="recent-winners">
                        <div class="loading">
                            <span class="loading-text">로딩 중</span>
                            <span class="loading-dots"></span>
                        </div>
                    </div>
                </div>

                <!-- 배경 포켓몬들 -->
                <div class="pokemon-background" id="pokemonBackground"></div>
            </div>
        </div>
    </div>

    <!-- 추첨 애니메이션 영역 -->
    <div id="drawingArea" class="drawing-area" style="display: none;">
        <div class="drawing-content">
            <div class="battle-screen">
                <div class="opponent-pokemon" id="opponentPokemon"></div>
                <div class="battle-message">
                    <div class="message-box">
                        <div class="message-text" id="drawingMessage">포켓볼에서 포켓몬이 나온다!</div>
                    </div>
                </div>
                <div id="selectedBalls" class="selected-balls"></div>
            </div>
        </div>
    </div>

    <!-- Supabase 환경변수 주입 (Vercel 환경변수를 여기에 주입) -->
    <script>
        // Vercel 환경변수는 빌드 타임에 주입되므로,
        // 서버 사이드 렌더링이 필요하거나, 
        // 또는 환경변수를 직접 여기에 설정해야 합니다.
        // 
        // 방법 1: Vercel 환경변수를 직접 설정 (보안 주의)
        // window.SUPABASE_URL = '%PUBLIC_SUPABASE_URL%';
        // window.SUPABASE_ANON_KEY = '%PUBLIC_SUPABASE_ANON_KEY%';
        //
        // 방법 2: config.js 파일 사용 (로컬 개발용)
        // 아래 스크립트가 config.js를 로드합니다
    </script>
    <!-- Supabase 설정 (로컬 개발용 config.js, Vercel에서는 환경변수 사용) -->
    <script src="config.js" onerror="console.log('config.js 파일이 없습니다. Vercel 환경변수를 사용하세요.')"></script>
    <script src="script.js"></script>
</body>
</html>
